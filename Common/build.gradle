plugins {
    id 'fabric-loom'
    id 'maven-publish'
}

base.archivesName = "${mod_id}-common-${minecraft_version}"

loom {
    runConfigs.configureEach {
        ideConfigGenerated = false
    }
}

dependencies {
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modCompileOnly("net.fabricmc:fabric-loader:${fabric_loader_version}")

    modCompileOnly group: 'info.journeymap', name: 'journeymap-api-fabric', version: project.journeymap_api_version, changing: true

    modCompileOnly "dev.architectury:architectury-fabric:${project.architectury_version}"
    modCompileOnly "curse.maven:${project.ftb_library_fabric}"
    modCompileOnly "curse.maven:${project.ftb_teams_fabric}"
    modCompileOnly "curse.maven:${project.ftb_chunks_fabric}"
    modCompileOnly "maven.modrinth:balm:${project.balm_fabric_version}"
    modCompileOnly "maven.modrinth:waystones:${project.waystones_fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    classpath += files({ sourceSets.main.compileClasspath })
}

processResources {

    def buildProps = project.properties.clone()

    filesMatching(['pack.mcmeta']) {

        expand buildProps
    }
}
